<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="'Noto Sans JP',sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0e6b8e"/></marker>
    <marker id="ar2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c9791d"/></marker>
  </defs>
  <rect width="960" height="520" fill="#ffffff"/>
  <rect x="40" y="60" width="400" height="400" rx="12" fill="#eaf3f8" stroke="#0e6b8e" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="60" y="92" fill="#0e6b8e" font-size="18" font-weight="700">制御盤（屋内・屋外兼用）</text>
  <g font-size="14" text-anchor="middle">
    <rect x="70" y="120" width="160" height="70" rx="8" fill="#fff" stroke="#9bbfd1"/><text x="150" y="150" fill="#333">電源</text><text x="150" y="172" fill="#777" font-size="11">配電制御機器</text>
    <rect x="250" y="120" width="160" height="70" rx="8" fill="#fff" stroke="#9bbfd1"/><text x="330" y="150" fill="#333" font-weight="700">タッチパネル</text><text x="330" y="172" fill="#777" font-size="11">5.7型 TFTカラー液晶</text>
    <rect x="70" y="230" width="340" height="110" rx="8" fill="#0e6b8e"/><text x="240" y="270" fill="#fff" font-size="20" font-weight="700">PLC（シーケンサ）</text><text x="240" y="296" fill="#dff1fb" font-size="12">日出没時刻表・緯度経度から太陽位置を算出</text><text x="240" y="316" fill="#dff1fb" font-size="12">センサー値をもとにプログラム制御</text>
    <rect x="70" y="370" width="340" height="60" rx="8" fill="#fff" stroke="#9bbfd1"/><text x="240" y="395" fill="#333" font-weight="700">自動 ⇄ 手動 切替</text><text x="240" y="416" fill="#777" font-size="11">タッチパネルからワンタッチで切替</text>
  </g>
  <line x1="150" y1="190" x2="150" y2="230" stroke="#0e6b8e" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="330" y1="190" x2="330" y2="230" stroke="#0e6b8e" stroke-width="2" marker-end="url(#ar)"/>
  <g font-size="14" text-anchor="middle">
    <rect x="540" y="200" width="170" height="90" rx="8" fill="#fff" stroke="#0e6b8e" stroke-width="2"/><text x="625" y="238" fill="#333" font-weight="700">ルーバー駆動モーター</text><text x="625" y="262" fill="#777" font-size="11">エンコーダー併用</text>
    <rect x="770" y="160" width="160" height="170" rx="8" fill="#f6efe4" stroke="#c9791d" stroke-width="2"/>
    <g fill="#c9791d"><rect x="800" y="180" width="100" height="8" rx="2" transform="rotate(-20 850 184)"/><rect x="800" y="212" width="100" height="8" rx="2" transform="rotate(-20 850 216)"/><rect x="800" y="244" width="100" height="8" rx="2" transform="rotate(-20 850 248)"/><rect x="800" y="276" width="100" height="8" rx="2" transform="rotate(-20 850 280)"/></g>
    <text x="850" y="315" fill="#333" font-weight="700">可動ルーバー</text>
    <rect x="540" y="330" width="170" height="70" rx="8" fill="#fff" stroke="#9bbfd1"/><text x="625" y="360" fill="#333" font-weight="700">日射計</text><text x="625" y="382" fill="#777" font-size="11">照度を出力</text>
    <rect x="540" y="60" width="170" height="70" rx="8" fill="#fff" stroke="#9bbfd1" stroke-dasharray="5 4"/><text x="625" y="90" fill="#333" font-weight="700">拡張センサー</text><text x="625" y="112" fill="#777" font-size="11">温度計・風速計・雨センサー 等</text>
  </g>
  <line x1="410" y1="285" x2="540" y2="245" stroke="#0e6b8e" stroke-width="2.5" marker-end="url(#ar)"/>
  <text x="470" y="250" fill="#0e6b8e" font-size="12" text-anchor="middle">駆動指令</text>
  <line x1="710" y1="245" x2="770" y2="245" stroke="#c9791d" stroke-width="2.5" marker-end="url(#ar2)"/>
  <line x1="540" y1="275" x2="410" y2="305" stroke="#c9791d" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ar2)"/>
  <text x="470" y="320" fill="#c9791d" font-size="12" text-anchor="middle">角度を出力</text>
  <line x1="540" y1="365" x2="410" y2="325" stroke="#c9791d" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ar2)"/>
  <text x="500" y="372" fill="#c9791d" font-size="12" text-anchor="middle">照度を出力</text>
  <line x1="540" y1="95" x2="410" y2="255" stroke="#9bbfd1" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#ar)"/>
  <text x="480" y="490" fill="#6b7a86" font-size="12" text-anchor="middle">システム構成イメージ（PLC：三菱電機製シーケンサ）</text>
</svg>
